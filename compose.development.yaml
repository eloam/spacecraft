# Development environment.
#
# The runner runs here, from the same image the Serverless Job deploys, executing pipeline
# steps in-process exactly as it will in production. The API stays on the host (`dotnet run`)
# because that is what you are editing.

name: spacecraft-development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spacecraft
      POSTGRES_PASSWORD: spacecraft
      POSTGRES_DB: spacecraft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacecraft -d spacecraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for specs, build artifacts and logs.
  #
  # Development only. Staging and production use Scaleway Object Storage, and the
  # application cannot tell the difference: it speaks the S3 API to whatever
  # ObjectStorage:ServiceUrl points at. Path-style addressing is the one setting that
  # differs — MinIO serves bucket-in-path, Scaleway and AWS serve virtual-hosted style.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spacecraft
      MINIO_ROOT_PASSWORD: spacecraft-dev-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console, http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once and exits. The application never creates it: doing so in
  # production would need a permission it has no other use for, and a typo in the name
  # would silently make a second bucket rather than fail.
  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 spacecraft spacecraft-dev-secret &&
      mc mb --ignore-existing local/openapi-bucket &&
      echo 'bucket openapi-bucket ready'
      "
    restart: "no"

  # A local SMTP relay that accepts everything and delivers nothing, with a web inbox on
  # http://localhost:8025. Password resets and waitlist confirmations can be read there
  # instead of being sent — and unlike the logging transport, this exercises the real
  # transport: MIME building, the SMTP conversation, the dispatcher behind the queue.
  #
  # It speaks plaintext, having no certificate, which is why Smtp:Security exists and
  # why "None" is refused outside development.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # inbox, http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A local npm registry, so the publish step can be exercised end to end without
  # pushing anything to npmjs.org. Publishing to a real registry is irreversible;
  # having a throwaway one is what makes this pipeline safe to develop against.
  verdaccio:
    image: verdaccio/verdaccio:6
    ports:
      - "4873:4873"
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - ./infra/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      # 127.0.0.1, not localhost: verdaccio binds IPv4 only, and the image resolves
      # localhost to ::1 first, which makes the probe fail against a healthy server.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4873/-/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Scaleway Key Manager, in the same spirit as MinIO for Object Storage and
  # Mailpit for SMTP: the code that wraps the Data Protection key ring in production is the
  # code that runs here, so a wrong header or a mis-encoded payload fails on this machine
  # rather than in production. It is a fake — the key sits in a file beside it — which is why
  # the application refuses a plaintext key-manager URL outside Development.
  fake-scaleway-kms:
    build:
      context: .
      dockerfile: infra/SpaceCraft.FakeScalewayKms/Dockerfile
    ports:
      - "8099:8099"
    volumes:
      # The key ring in Postgres is encrypted with the key in here. Regenerating it would
      # strand every credential the database still holds, so it outlives the container.
      - fake-kms-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8099/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The pipeline, from the image production deploys. Same entrypoint, same toolchain, same
  # in-process execution — so a run that works here works there, and one that does not fails
  # here first.
  runner:
    build:
      context: .
      dockerfile: src/SpaceCraft.Runner/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      verdaccio:
        condition: service_healthy
      fake-scaleway-kms:
        condition: service_healthy
    environment:
      # The image is the one production deploys; the environment it runs in is not. Saying so
      # is what lets key protection refuse a plaintext key-manager URL everywhere else — the
      # fake next door is reachable over http on a private network, and that must never be a
      # shape production can take. Every setting below is passed explicitly, so this changes
      # no behaviour beyond the environment name itself.
      DOTNET_ENVIRONMENT: "Development"
      # The runner decrypts what the API encrypted, so it must reach the same key manager
      # with the same key. Divergence here is a publish that cannot read its own credential.
      KeyProtection__Provider: "ScalewayKms"
      KeyProtection__BaseUrl: "http://fake-scaleway-kms:8099"
      KeyProtection__Region: "fr-par"
      KeyProtection__KeyId: "00000000-0000-4000-8000-000000000001"
      KeyProtection__SecretKey: "fake-token"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=spacecraft;Username=spacecraft;Password=spacecraft"
      ObjectStorage__ServiceUrl: "http://minio:9000"
      ObjectStorage__BucketName: "openapi-bucket"
      ObjectStorage__AccessKey: "spacecraft"
      ObjectStorage__SecretKey: "spacecraft-dev-secret"
      ObjectStorage__ForcePathStyle: "true"
      # Where dependencies are resolved from, not where packages go: that is on the
      # credential now. Verdaccio proxies npmjs, so this also keeps builds off the wire.
      Pipeline__DependencyRegistry: "http://verdaccio:4873"
      Database__MigrateOnStartup: "false"
    # One shot, then gone. This service no longer watches the queue: fake-scaleway-jobs starts
    # a container per run, the way the deployment starts a job per run. What it still does is
    # A run id that does not exist: the container boots the whole container — Postgres, storage,
    # key protection — finds nothing to claim, and exits 0. A smoke test of the image on the
    # real entry point, which is the only one there is now.
    command: ["--run", "00000000-0000-0000-0000-000000000000"]
    restart: "no"

  # Stands in for Scaleway Serverless Jobs. The API calls it to start one container per run —
  # the same call, the same routes and the same quota refusal it will meet in production. It
  # holds the Docker socket because starting a job here means starting a container; see its
  # Program.cs for why that is the design and what it costs.
  fake-scaleway-jobs:
    build:
      context: .
      dockerfile: infra/SpaceCraft.FakeScalewayJobs/Dockerfile
    ports:
      - "8098:8098"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # The image compose just built, and the network it must join to reach postgres, minio,
      # verdaccio and the fake key manager. Both are named by the compose project, so neither
      # can be hardcoded in the fake: this file is the only place that knows them.
      Fake__Definitions__spacecraft-pipeline__Image: "spacecraft-development-runner"
      Fake__Definitions__spacecraft-pipeline__Network: "spacecraft-development_default"
      # What a job definition carries in production: the platform's own settings. The run id is
      # not here — it travels as an argument on the execution.
      Fake__Definitions__spacecraft-pipeline__Env__DOTNET_ENVIRONMENT: "Development"
      Fake__Definitions__spacecraft-pipeline__Env__KeyProtection__Provider: "ScalewayKms"
      Fake__Definitions__spacecraft-pipeline__Env__KeyProtection__BaseUrl: "http://fake-scaleway-kms:8099"
      Fake__Definitions__spacecraft-pipeline__Env__KeyProtection__Region: "fr-par"
      Fake__Definitions__spacecraft-pipeline__Env__KeyProtection__KeyId: "00000000-0000-4000-8000-000000000001"
      Fake__Definitions__spacecraft-pipeline__Env__KeyProtection__SecretKey: "fake-token"
      Fake__Definitions__spacecraft-pipeline__Env__ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=spacecraft;Username=spacecraft;Password=spacecraft"
      Fake__Definitions__spacecraft-pipeline__Env__ObjectStorage__ServiceUrl: "http://minio:9000"
      Fake__Definitions__spacecraft-pipeline__Env__ObjectStorage__BucketName: "openapi-bucket"
      Fake__Definitions__spacecraft-pipeline__Env__ObjectStorage__AccessKey: "spacecraft"
      Fake__Definitions__spacecraft-pipeline__Env__ObjectStorage__SecretKey: "spacecraft-dev-secret"
      Fake__Definitions__spacecraft-pipeline__Env__ObjectStorage__ForcePathStyle: "true"
      Fake__Definitions__spacecraft-pipeline__Env__Pipeline__DependencyRegistry: "http://verdaccio:4873"
      Fake__Definitions__spacecraft-pipeline__Env__Database__MigrateOnStartup: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8098/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  fake-kms-data:
  minio-data:
  verdaccio-storage:

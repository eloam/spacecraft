name: CI

# Every pull request, and every push to main so a merge that breaks something is caught even
# when the branch was green before the merge.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run it interrupted: nothing downstream depends on a stale result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From global.json, so CI and a developer machine agree on the SDK without the version
      # being written down twice.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      # TreatWarningsAsErrors is on in Directory.Build.props, so this covers the analysers too.
      - run: dotnet build --no-restore --configuration Release

      # Not `dotnet test`: on SDK 10.0.100 it refuses with "Testing with VSTest target is no
      # longer supported", and neither the dotnet.config opt-in nor
      # -p:TestingPlatformDotnetTestSupport=true gets past it. The test projects are
      # executables under Microsoft.Testing.Platform, so running them is the supported path.
      - name: Unit tests
        run: dotnet run --project tests/SpaceCraft.UnitTests --configuration Release --no-build

      # Separate step so a failure says which kind of test broke without reading the log.
      # These stand up Postgres in a container through Testcontainers, which the hosted
      # runners already provide a Docker daemon for.
      - name: Integration tests
        run: dotnet run --project tests/SpaceCraft.IntegrationTests --configuration Release --no-build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
        working-directory: src/web

      # Only the browser these tests run in, and only its dependencies. The full install pulls
      # three engines and most of a desktop.
      - run: npx playwright install --with-deps chromium
        working-directory: src/web

      # The API and the runner are built from this checkout, so the tests run against the
      # images the release would ship rather than against something assembled for testing.
      - name: Start the stack
        run: docker compose -f compose.e2e.yaml up -d --build --wait

      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: src/web

      # What the API and the runner were doing while a test failed, which a trace cannot show.
      - name: Stack logs
        if: failure()
        run: docker compose -f compose.e2e.yaml logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/web/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.e2e.yaml down -v

  images:
    name: Images build
    runs-on: ubuntu-latest
    # Built but never pushed here. A Dockerfile that has drifted from the source otherwise
    # only fails at release time, which is the worst moment to find out.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/SpaceCraft.Api/Dockerfile
          - name: runner
            dockerfile: src/SpaceCraft.Runner/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

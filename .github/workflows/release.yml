name: Release

# Tags only. A commit on main is not a release: pushing an image for a README change would
# churn the registry and blur which digest is deployed.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Scaleway Container Registry. Both overridable as repository variables so a fork or a
  # second environment does not need this file edited.
  REGISTRY: ${{ vars.SCW_REGISTRY_ENDPOINT || 'rg.fr-par.scw.cloud' }}
  NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE || 'spacecraft' }}

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      # See ci.yml for why this is not `dotnet test`.
      - run: dotnet run --project tests/SpaceCraft.UnitTests --configuration Release --no-build

  publish:
    name: Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A tag is not a promise that the code was ever green: it can be cut from any commit.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/SpaceCraft.Api/Dockerfile
          - name: runner
            dockerfile: src/SpaceCraft.Runner/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Scaleway ignores the username and authenticates on the secret key alone; "nologin" is
      # the placeholder its documentation uses.
      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/spacecraft-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # latest only for a final release, so a prerelease tag never becomes what an
          # unpinned deployment pulls.
          flavor: latest=auto

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The digest is what a Job or Container definition should reference. A tag can be moved;
      # a digest cannot, and "which build is actually running" stops being a question.
      - name: Report the digest
        run: |
          echo "### spacecraft-${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/spacecraft-${{ matrix.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
